version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerpilot_user} -d ${POSTGRES_DB:-careerpilot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: careerpilot_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-careerpilot_user}:${POSTGRES_PASSWORD:-careerpilot_secret}@postgres:5432/${POSTGRES_DB:-careerpilot_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-careerpilot_user}:${POSTGRES_PASSWORD:-careerpilot_secret}@postgres:5432/${POSTGRES_DB:-careerpilot_db}
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: careerpilot_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
